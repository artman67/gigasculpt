# Protected file. See docs/ARCHITECTURE.md section 8 (determinism) and 10.5.
too-many-lines-threshold = 80
allow-unwrap-in-tests = true
allow-expect-in-tests = true
doc-valid-idents = ["GigaSculpt", "MatCap", "MatCaps", ".."]

disallowed-types = [
  { path = "std::collections::HashMap", reason = "random iteration order breaks determinism; use BTreeMap or IndexMap" },
  { path = "std::collections::HashSet", reason = "random iteration order breaks determinism; use BTreeSet or IndexSet" },
]

