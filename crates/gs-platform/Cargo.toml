[package]
name = "gs-platform"
description = "The only crate that touches SDL3: window, events, pen input as PenSample."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gs-protocol.workspace = true
# SDL 3.4.18 or newer, built from source and linked statically: the system's 3.4.16 never
# reports the eraser (docs/spikes/pen.md), and a static build cannot load the older system
# library at run time by mistake.
sdl3.workspace = true
raw-window-handle.workspace = true

[features]
# Test support: a private Xvfb display (`src/xvfb.rs`). Test programs only.
xvfb = []

[dev-dependencies]
proptest.workspace = true
sdl3.workspace = true
raw-window-handle.workspace = true
libtest-mimic.workspace = true

# Runs itself inside a private Xvfb display; see the file.
[[test]]
name = "x11"
harness = false

[lints]
workspace = true
