[package]
name = "gs-io"
description = "File formats: our scene files (.gss) in and out; OBJ, PLY and STL in and out; ZBP brush, ZTL tool and ZPR project files in."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gs-core.workspace = true
gs-par.workspace = true
gs-protocol.workspace = true
# Scene files (decision 0016): chunk hashes, the JSON manifest and zstd.
blake3.workspace = true
serde.workspace = true
# float_roundtrip: a Part's properties come back bit for bit (decision 0016, section 5).
serde_json = { workspace = true, features = ["float_roundtrip"] }
zstd = { version = "0.13.3", default-features = false }

# Scene files' free-space check, which only Unix makes.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
