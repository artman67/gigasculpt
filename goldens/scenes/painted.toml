about = "A painted part (decision 0039, section 9): point colors in a ramp up its height with three flat patches, carried through three smooth levels, multiply the albedo in Clay, MatCap and Lit, and a metal's reflections (R7 in research 27)."
view = "iso"
looks = ["clay", "matcap:white", "lit:gray", "matcap:metal-1", "lit:metal-1"]
closed = true

# A cube cut 4 by 4 on each side. Colors are sRGB bytes as Rgba8 words, red in the low byte:
# the ramp runs blue to orange from the bottom row of points to the top, and the middle 2 by 2
# faces of the front, right and top sides are red, green and violet.
