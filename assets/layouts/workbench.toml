# Workbench (decision 0025), the layout that ships: shelves and trays grouped by task. Its lists
# name pieces: a set of controls (controls/*.toml, a file per tray, says what each control
# does), one group of a set (`set/Group`; `mask/` is the Mask set's first group), or a shared
# widget (gs-ui direction.rs, `WIDGETS`, beside the file's format). Each comment below says what
# its keys hold:
# - `palette`: the command palette (Space), near the window's top, centered, 680 points wide.
# - `wheel`: the brush wheel (F2 held, or a barrel click as shipped) holds the brushes, each slot
#   320 points from the pen.
# - `reference`: an open Reference View docks on the right, between the 3D view and the scene
#   tray, 560 points wide; its inner edge resizes it.
# - `settings`: the settings window's sets, in order (Window > Settings; decision 0060, section 7).
# - `quick`: the quick menu at the pointer (Shift+Space): the brush's Size, Strength and Softness,
#   each on a row of its own, symmetry's switches (the axis kinds are under the header's Symmetry
#   ▼), the mask's own operations, and History: the pieces decision 0060 confirms (section 10,
#   amended for UI-last; decision 0062, row 819).

title = "Workbench"
order = 1
palette = { place = "top", width = 680 }
wheel = { show = "brushes", radius = 320 }
reference = { place = "right", width = 560 }
settings = ["pen", "held-keys", "navigation", "sliders", "wheel", "scale", "part-list", "brush-cursor", "theme", "themes", "files", "voxel", "keys"]
quick = ["size", "strength", "falloff", "symmetry/Switches", "mask/", "history"]

# The Library (decision 0025, section 13): a drawer along the bottom of the 3D view, opened by
# Library in the shelf's Quick group, showing one tab at a time as a row of tiles.
library = [
  { id = "brushes", title = "Brushes", show = "brushes" },
  { id = "alphas", title = "Alphas", show = "alphas" },
  { id = "matcaps", title = "Materials", show = "looks" },
  { id = "environments", title = "Environments", show = "environment" },
  { id = "layouts", title = "Layouts", show = "layouts" },
  { id = "themes", title = "Themes", show = "themes" },
]

# The header along the 3D view's top (decision 0060, section 2): its menus by piece name, in
# order, at the far end from the pen (sets in controls/header.toml; `deform` is the Deform
# dropdown panel, decision 0041 as amended for DF7a), and the pieces at its pen end (`show`): the
# view's buttons with Isolate (`view`, controls/strip.toml), then Look and Symmetry, whose
# buttons' options are `options`. Symmetry shows its switches on the bar and folds into its
# button where they would take the bar past two rows (decision 0060 as amended for H6). While the
# menus' titles do not fit one row they fold into one button (`fold`; decision 0060 as amended
# for H7).
[header]
menus = ["file", "add", "part", "mesh", "mask", "visible", "groups", "deform", "view-menu", "window"]
show = ["view", "look", "symmetry"]
fold = { label = "Menus", hint = "The header's menus, folded into one while the 3D view is too narrow for their titles: a tap lists them, and each opens its menu beside its name." }
options = [
  { id = "look", label = "Look", hint = "How every view is shaded and lit, its MatCap and the look's material.", show = ["shading", "looks", "tone", "environment", "lights", "material"] },
  { id = "symmetry", label = "Symmetry", hint = "Symmetry's switches and each lit axis's kind, folded into one button while the 3D view is too narrow for them. Lit while symmetry is on.", shows = "symmetry.on", show = ["symmetry/Switches", "symmetry-kinds"] },
]

# The active tool's settings in Brush tray > Basics: the first tool whose `when` state value is
# true; one without `when` always matches, so the brush comes last. A tool's `tray`, when given,
# is the Brush tray's sections while it is on. While the Gizmo tool is on, the tray is the
# tool's name and `···`, Basics with the brush's Size titled Reach (what a soft drag reaches)
# and the gizmo's settings, then Pose; else Basics holds the brush's Size and Strength, each
# with its pen toggle, Add and Subtract (`mode`), then Pressure… (decision 0060, section 6).
[[tool]]
id = "gizmo"
when = "gizmo.tool"
show = ["reach", "gizmo"]
tray = ["head", "brush", "pose"]

[[tool]]
id = "brush"
show = ["size", "strength", "mode", "pressure"]

# The panels. The brush shelf along the top: the Gizmo tool first, so it shows however the brushes
# wrap, then a button per brush family (`families`; gs-ui family.rs says what a tap and a held
# press do), the favorites pinned in the Library (none ship), then Quick (Back, Wheel, Find and
# Library). The brush tray, on the left (away from a right-handed pen), holds what the next
# stroke does: its header (the brush's name, which opens the brush picker, and its `···`: Save
# brush…, Load brush…, Reset to defaults, then Copy settings to with each other brush as a
# button), Basics (the active tool's settings, above), then Tip, Stroke, Alpha, Paint and Depth.
# The scene tray, on the right, holds the parts, the detail levels with Live Detail, and History.
# In a tray each piece is a section under its title, which folds it shut. A tray's inner edge
# drags it wider or narrower, and layout.toml keeps the width; Window > Left hand swaps the sides.
[[panel]]
id = "shelf"
title = "Brush shelf"
edge = "top"
size = 64
show = ["tools", "families", "favorites", "recall"]

[[panel]]
id = "brush"
title = "Brush tray"
edge = "left"
size = 280
show = ["head", "brush", "curve", "stroke", "alpha", "paint", "depth"]

[[panel]]
id = "tray"
title = "Scene tray"
edge = "right"
size = 300
show = ["parts", "detail", "history"]
