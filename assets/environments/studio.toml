# Studio: the default environment of every shipped look (gs-render shading::environment).
# A photographer's three-point setup in a dark room: a large key soft box above and to the
# left of the camera, a dimmer and larger fill on the right, and a narrow rim strip behind on
# the right. Radiance in cd/m^2, in the range of LED soft boxes; the environment is metered
# afterwards (a white diffuser facing the camera reflects 1), so only the ratios matter:
# key to fill about 5 to 1 in light on the subject, about 2.3 stops.
# Directions are camera-relative: x right, y up, z toward the viewer.
name = "Studio"

# Dark gray walls and ceiling lit by spill; a mid-gray floor (18% albedo) lit by the lights.
[room]
walls = 30.0
ceiling = 45.0
floor_albedo = 0.18

# A 1 by 1.3 m box at about 1.4 m, upper left in front.
[[softbox]]
name = "key"
direction = [-0.45, 0.55, 0.70]
width = 0.35
height = 0.45
radiance = 5000.0

# A larger, dimmer box low on the right in front.
[[softbox]]
name = "fill"
direction = [0.75, 0.05, 0.65]
width = 0.45
height = 0.6
radiance = 600.0

# A narrow strip behind the subject on the right, for the edge light.
[[softbox]]
name = "rim"
direction = [0.55, 0.35, -0.75]
width = 0.08
height = 0.5
radiance = 8000.0
