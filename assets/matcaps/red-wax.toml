# MatCap Red Wax (catalog item material.matcap-red-wax). A physical look: the shared material model (gs-render
# shading), lit by the studio environment and baked into a MatCap. Format: material.look-recipe.
# Colors in brackets are linear; values are the material's, never tuned toward a picture.
name = "MatCap Red Wax"
catalog_id = "material.matcap-red-wax"
environment = "studio"

# Red-dyed modeling wax. There is no measured entry for wax, so these are physically
# plausible choices for the maintainer to judge once on this model: a red dye's albedo, the
# refractive index of paraffin (about 1.44), a semi-gloss finish, and a mean free path of
# 5 mm in red (wax glows several millimeters deep), shorter in green and blue as OpenPBR's
# default scale has it.
[material]
base_color = [0.6, 0.12, 0.06]
specular_roughness = 0.35
specular_ior = 1.44
subsurface_weight = 1.0
subsurface_radius = 5.0
subsurface_radius_scale = [1.0, 0.5, 0.25]
