<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" color-interpolation-filters="sRGB">
  <!-- GigaSculpt's icon: the logo (logo.png beside this file, a render with a transparent
       background) on a rounded square in the interface's grays, laid out on macOS's icon grid:
       an 824-pixel body in a 1024-pixel canvas, with a soft shadow below it. make.py writes
       every icon file from this one; see README.md. -->
  <defs>
    <path id="body" d="M383.4 100L640.6 100C722.2 100 763 100 799.8 106.6L806.9 109.1C855.9 126.8 897.2 168.1 914.9 217.1L917.4 224.2C924 261 924 301.8 924 383.4L924 640.6C924 722.2 924 763 917.4 799.8L914.9 806.9C897.2 855.9 855.9 897.2 806.9 914.9L799.8 917.4C763 924 722.2 924 640.6 924L383.4 924C301.8 924 261 924 224.2 917.4L217.1 914.9C168.1 897.2 126.8 855.9 109.1 806.9L106.6 799.8C100 763 100 722.2 100 640.6L100 383.4C100 301.8 100 261 106.6 224.2L109.1 217.1C126.8 168.1 168.1 126.8 217.1 109.1L224.2 106.6C261 100 301.8 100 383.4 100Z"/>
    <clipPath id="inside"><use xlink:href="#body"/></clipPath>
    <linearGradient id="gray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3b3b"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <use xlink:href="#body" fill="url(#gray)" filter="url(#shadow)"/>
  <g clip-path="url(#inside)">
    <image href="logo.png" x="100" y="100" width="824" height="824" filter="url(#lift)"/>
  </g>
</svg>
