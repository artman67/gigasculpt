# Inflate: pushes each vertex along its own normal, so the surface swells like a balloon.
version = 1
name = "Inflate"
id = "brush.inflate"
family = "Build"
strength = 0.25
claims = ["local", "masked_unchanged", "mirror_symmetric", "spacing_invariant", "rate_invariant", "volume_non_decreasing", "reference"]

[kernel]
type = "offset"
terms = [{ dir = "vertex_normal", gain = 0.5 }]

[tip]
profile = "smooth"

[stroke]
class = "dab"
spacing = 0.1
tap = 0.5
