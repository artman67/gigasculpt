# Smooth Polish: a medium polish between Flat Polish and a soft one: the plane follows the
# form, the pull is gentler and the edge soft. Like the rest of the Polish family it cuts by
# default and Alt fills (research 10). All else inferred.
version = 1
name = "Smooth Polish"
id = "brush.smooth-polish"
family = "Smooth"
strength = 0.2
claims = ["local", "masked_unchanged", "mirror_symmetric", "spacing_invariant", "rate_invariant", "reference"]

[kernel]
type = "plane"
source = "dab"
side = "above"
gain = 2.0

[tip]
profile = "smooth"

[sampling]
normal_radius = 1.0
position_radius = 1.0
accumulate = true

[stroke]
class = "dab"
spacing = 0.05
tap = 0.5
