# Move Elastic: Move, with the polygons around the moved area kept evenly sized: after every
# update a relax pass (the Smooth kernel's relax target) evens out the edge lengths within the
# brush, weighted by the move and growing with the pull. Switched off on parts above 25,000
# faces, where it acts exactly like Move, because its work grows with density (research 10).
# The relax gain is a placeholder until it is measured.
version = 1
name = "Move Elastic"
id = "brush.move-elastic"
family = "Move"
strength = 1.0
claims = ["local", "masked_unchanged", "mirror_symmetric", "drag_idempotent", "reference"]

[kernel]
type = "move"
select = "ball"

[tip]
profile = "smooth"

[stroke]
class = "drag"

[pressure]
strength = [[0, 1], [1, 1]]
# A flat size curve of its own: a drag sizes its grab by the first sample's pressure, light at
# touch down, so the session's size curve passes this brush by (decision 0036).
size = [[0, 1], [1, 1]]

[post]
auto_smooth = 1.0
auto_smooth_mode = "relax"
auto_smooth_max_faces = 25000

# Backface masking stays off for the Move family: it would stop the drag from grabbing points
# that face away (catalog brush-settings.auto-masking).
[automask]
backface = 0.0
