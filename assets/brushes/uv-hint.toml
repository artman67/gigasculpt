# UV Hint: paints where Auto UV puts seams, from protect (-1) to attract (1); Alt toward 0.
version = 1
name = "UV Hint"
id = "brush.uv-hint"
family = "Mask"
strength = 1.0
claims = ["local", "mirror_symmetric", "spacing_invariant", "rate_invariant"]

[kernel]
type = "attribute"
column = "uv_hint"
op = "set"
value = 1.0
gain = 8.0

[tip]
profile = "smooth"

[stroke]
class = "dab"
spacing = 0.1
tap = 0.5
