# Move: grabs what is under the brush at stroke start and drags it by the pointer's offset,
# always from the stroke-start surface, so dragging out and back restores it exactly.
version = 1
name = "Move"
id = "brush.move"
family = "Move"
strength = 1.0
claims = ["local", "masked_unchanged", "mirror_symmetric", "drag_idempotent", "reference"]

[kernel]
type = "move"
select = "ball"

[tip]
profile = "smooth"

[stroke]
class = "drag"

[pressure]
strength = [[0, 1], [1, 1]]
# A flat size curve of its own: a drag sizes its grab by the first sample's pressure, light at
# touch down, so the session's size curve passes this brush by (decision 0036).
size = [[0, 1], [1, 1]]

# Backface masking stays off for the Move family: it would stop the drag from grabbing points
# that face away (catalog brush-settings.auto-masking).
[automask]
backface = 0.0
