# Clay Build: fills up to a plane fitted under every dab, a little above the surface, so passes
# stack in flat-topped layers, stamping the square tip it ships with. Accumulate (Buildup) on:
# the fit sees the height this stroke already added. A plane, not a push along the normal: it
# fills hollows and covers detail (research 10).
version = 1
name = "Clay Build"
id = "brush.clay-build"
family = "Build"
strength = 0.25
claims = ["local", "masked_unchanged", "mirror_symmetric", "spacing_invariant", "rate_invariant", "reference"]

[kernel]
type = "plane"
source = "dab"
side = "below"
gain = 4.0

[tip]
profile = "smooth"
hardness = 0.6

[tip.alpha]
image = "square"

[depth]
imbed = 0.1

[sampling]
normal_radius = 0.5
position_radius = 0.5
accumulate = true

[stroke]
class = "dab"
spacing = 0.05
tap = 0.5
