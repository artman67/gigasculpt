# Protected file. Every dependency must be compatible with GPL-3.0-or-later.
[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "GPL-3.0-or-later",
  "GPL-2.0-or-later",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
]
# AGPL (for example dssim) is not on the list, so it fails the check.

[bans]
multiple-versions = "allow"
# Kernels reach rayon only through gs-par, so float reductions stay thread-count independent.
# A third-party crate that pulls in rayon must be added to wrappers here, visibly.
# manifold-rust (decision 0057): its parallel steps are per-index maps and stable sorts on the
# caller's pool, measured bit-identical at 1 and 24 threads (research 26); pinned =0.16.0.
deny = [{ crate = "rayon", wrappers = ["gs-par", "manifold-rust"], reason = "use gs-par so results are bit-identical at any thread count" }]
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
